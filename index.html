const EN=()=>S.lang==='en';
function t(k){const e=T[k];return e?(e[S.lang]||e.zh):k;}
const PH_EN={leaf:["Bare / leafless","Budding / new leaf","Mature leaf"],flower:["No flower","Flower bud / swelling","Full bloom"],fruit:["No fruit","Ripening","Full ripe"]};
function phLabs(ph){return EN()?PH_EN[ph]:M.phases[ph];}
function phName(ph){return t('ph_'+ph);}
const FORMS={"0":{zh:"喬木",en:"Tree"},"1":{zh:"灌木",en:"Shrub"},"2":{zh:"草",en:"Herb"},"3":{zh:"附生",en:"Epiphyte"},"4":{zh:"藤",en:"Vine"}};
function formKey(f){return ((f||"").split("-")[0]||"").trim();}
function formLabel(f){const k=formKey(f);return (FORMS[k]&&FORMS[k][S.lang])||f||"—";}

const FAMS={},GENS={},SPS={};
D.individuals.forEach(i=>{if(i.fam)FAMS[i.fam]=i.fam_sci||i.fam;if(i.gen)GENS[i.gen]=i.gen_sci||i.gen;if(i.species)SPS[i.species]=i.sci||i.species;});
function famDisp(i){return (EN()?(i.fam_sci||i.fam):i.fam)||"—";}
function indName(i){return (EN()?(i.sci||i.name.replace(/\n/g,"／")):i.name.replace(/\n/g,"／"));}
function spDisp(v){return EN()?(SPS[v]||v):v;}

// ============ conservation ============
const THREAT=new Set(["CR","EN","VU","NT"]);
const redThreat=v=>v&&!["NLC","NA","NE","DD",""].includes(v);
const hasCons=i=>THREAT.has(i.iucn)||redThreat(i.redlist)||!!i.cites||!!i.protected||!!i.sensitive;
function consMatch(i,k){if(!k)return true;if(k==="iucn")return THREAT.has(i.iucn);if(k==="redlist")return redThreat(i.redlist);
  if(k==="cites")return !!i.cites;if(k==="protected")return !!i.protected;if(k==="sensitive")return !!i.sensitive;if(k==="any")return hasCons(i);return true;}
function consStr(i){const p=[];if(i.cites)p.push("CITES "+i.cites);if(i.iucn)p.push("IUCN "+i.iucn);
  if(i.redlist)p.push((EN()?"TW Red List ":"國家紅皮書 ")+i.redlist);if(i.protected)p.push(t('consProt'));if(i.sensitive)p.push(t('consSens'));
  return p.length?p.join(" ｜ "):t('notListed');}
function badges(i){let h="";
  if(i.retired)h+=`<span class="badge dead">${t('retired')}</span>`;
  if(i.alive===false)h+=`<span class="badge dead">${t('dead')}</span>`;
  if(i.endemic)h+=`<span class="badge end">${t('endemic')}</span>`;
  if(THREAT.has(i.iucn))h+=`<span class="badge ${i.iucn==='NT'?'warn':'threat'}">IUCN ${i.iucn}</span>`;
  if(redThreat(i.redlist))h+=`<span class="badge warn">${EN()?'TW Red List':'國家紅皮書'} ${i.redlist}</span>`;
  if(i.cites)h+=`<span class="badge threat">CITES ${i.cites}</span>`;
  if(i.protected)h+=`<span class="badge threat">${t('consProt')}</span>`;
  if(i.sensitive)h+=`<span class="badge warn">${t('consSens')}</span>`;
  return h?`<div style="margin:0 0 9px">${h}</div>`:"";}

// ============ scoping ============
const yearsInPlay=()=>S.yr?[S.yr]:YEARS;
function inScopeBase(){   // SCOPE tier only
  // 三態：僅現存主檔（預設）／含已枯死／全部（含主檔已除名、僅存歷史的個體）
  return D.individuals.filter(i=>{
    if(S.seg&&i.segment!==S.seg)return false;
    if(S.alive==="all")return true;
    if(i.retired)return false;                 // 除名個體只在「全部」時出現
    if(S.alive==="alive"&&i.alive===false)return false;
    return true;});
}
// 物種搜尋：比對中文物種名與學名（不分大小寫）。
const spQuery=()=>SUBJ_OF("tax")?(S.spq||"").trim().toLowerCase():"";
const spMatch=(x,q)=>!q||String(x||"").toLowerCase().includes(q)||String(SPS[x]||"").toLowerCase().includes(q);
function inScope(){       // SCOPE + SUBJECT tiers
  const q=spQuery();
  return inScopeBase().filter(i=>
    spMatch(i.species,q)&&
    (!S.fam||i.fam===S.fam)&&(!S.gen||i.gen===S.gen)&&(!S.sp||i.species===S.sp)&&
    (!S.form||formKey(i.form)===S.form)&&(!S.endemic||i.endemic)&&consMatch(i,S.cons)&&
    (!S.only2||(i.obs_years||[]).length>=2));
}
const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),"zh-Hant"));

// survey calendar: a month counts as surveyed if a 踏查日 was recorded, else if any value exists
const SURVEYED={};
YEARS.forEach(y=>{
  const days=(M.survey_days&&M.survey_days[y])||null;
  const any=Array(12).fill(false);
  D.individuals.forEach(i=>{const o=i.obs[y];if(!o)return;["leaf","flower","fruit"].forEach(p=>o[p].forEach((v,m)=>{if(v!=null)any[m]=true;}));});
  SURVEYED[y]=any.map((a,m)=>days?(days[m]!=null||a):a);
});
function surveyDay(y,m){const d=(M.survey_days&&M.survey_days[y])||null;return d?d[m]:null;}
function monthFrac(y,m){const d=surveyDay(y,m);return m+((d?d:15)-1)/30;}

  document.getElementById("asof").innerHTML=`<span class="dot"></span><div><b>${t('asof')} ${M.asof||"—"}</b> · ${t('nextUp')}</div>`;
  const segs=M.segments||[];
  const opt=(v,lab,cur)=>`<option value="${esc(v)}"${String(cur)===String(v)?" selected":""}>${esc(lab)}</option>`;
  document.getElementById("scopebar").innerHTML=
   `<span class="tier t1">${t('scope')} SCOPE</span>`+
   `<span class="lb">${EN()?"applies to every view":"全站共用"}</span>`+
   `<label class="ctl"><span>${t('lYr')}</span><select id="scYr">${opt("",t('allYr'),S.yr)+YEARS.map(y=>opt(y,y,S.yr)).join("")}</select></label>`+
   (segs.length?`<label class="ctl"><span>${t('lSeg')}</span><select id="scSeg">${opt("",t('allSeg')+" ("+segs.length+")",S.seg)+segs.map(g=>opt(g,g,S.seg)).join("")}</select></label>`:"")+
   `<label class="ctl"><span>${t('lAlive')}</span><select id="scAlive">`+
     [["alive",t('aliveOnly'),D.individuals.filter(i=>!i.retired&&i.alive!==false).length],
      ["dead", t('allSt'),    D.individuals.filter(i=>!i.retired).length],
      ["all",  t('allRetired'),D.individuals.length]]
     .map(([v,l,n])=>opt(v,l+" ("+n+")",S.alive)).join("")+`</select></label>`;
  const b=(id,fn)=>{const e=document.getElementById(id);if(e)e.onchange=ev=>{fn(ev.target.value);render();};};
  b("scYr",v=>{S.yr=v;if(v){S.seqYear=v;S.covYear=v;}});
  b("scSeg",v=>{S.seg=v;S.ind="";});
  b("scAlive",v=>{S.alive=v;});
}

// ============ nav ============
function renderNav(){
  const groups=[["gField","field"],["gAna","analysis"],["gRef","ref"]];
  document.getElementById("nav").innerHTML=groups.map(([gk])=>{
    const keys=Object.keys(VIEWS).filter(k=>VIEWS[k].g===gk);
    return `<div class="ngrp"><div class="ngl">${t(gk)}</div>`+
      keys.map(k=>`<button data-v="${k}" class="${S.tab===k?'on':''}">${t(VIEWS[k].lab)}${VIEWS[k].nb?`<span class="nb">${EN()?'new':'新'}</span>`:''}</button>`).join("")+
      `</div>`;}).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.v;render();});
}

// ============ chips ============
function chipList(){
  const L=[];
  const push=(k,lab,val)=>L.push({k,tier:tierOf(k),lab,val});
  if(S.yr)push("yr",t('lYr'),S.yr);
  if(S.seg)push("seg",t('lSeg'),S.seg);
  if(S.alive!=="alive")push("alive",t('lAlive'),S.alive==="all"?t('allRetired'):t('allSt'));
  if(SUBJ_OF("phase"))push("phase",EN()?"Phase":"物候相",phName(S.phase));
  if(S.fam&&SUBJ_OF("tax"))push("fam",t('lFam'),EN()?(FAMS[S.fam]||S.fam):S.fam);
  if(S.gen&&SUBJ_OF("tax"))push("gen",t('lGen'),EN()?(GENS[S.gen]||S.gen):S.gen);
  if(S.sp&&SUBJ_OF("tax"))push("sp",t('lSp'),spDisp(S.sp));
  if(spQuery())push("spq",EN()?"Search":"搜尋",S.spq.trim());
  if(S.form&&SUBJ_OF("form"))push("form",t('lForm'),formLabel(S.form));
  if(S.cons&&SUBJ_OF("cons"))push("cons",t('lCons'),t({any:'consAny',iucn:'consIucn',redlist:'consRed',cites:'consCites',protected:'consProt',sensitive:'consSens'}[S.cons]||'consAll'));
  if(S.endemic&&SUBJ_OF("endemic"))push("endemic",t('lCons'),t('endemic'));
  if(DISP_OF("thr"))push("thr",t('dThr'),"≥"+S.thr);
  if(DISP_OF("denom")&&S.denom!=="surveyed")push("denom",t('dDenom'),S.denom==="recorded"?t('dPhase'):t('dYear'));
  if(DISP_OF("minN")&&S.minN!==1)push("minN",t('dMinN'),"n≥"+S.minN);
  if(DISP_OF("only2")&&S.only2)push("only2",t('display'),t('dOnly2'));
  return L;
}
function renderChips(){
  const L=chipList(), C=["","var(--scope)","var(--subject)","var(--display)"];
  const N=[" ",t('scope'),t('subject'),t('display')];
  document.getElementById("chips").innerHTML=
    `<span class="cl">${t('chipsLbl')}</span>`+
    (L.length?L.map(c=>`<span class="chip"><span class="bd" style="background:${C[c.tier]}">${N[c.tier]}</span>${esc(c.lab)}：${esc(c.val)}<button data-k="${c.k}" title="remove">×</button></span>`).join("")
             :`<span class="cl">${EN()?"— no filters —":"—（未套用篩選）—"}</span>`)+
    `<button class="rst" id="rstAll">${t('reset')}</button>`+
    `<span class="hint" id="shareHint">${t('shareHint')}</span>`;
  document.querySelectorAll("#chips .chip button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    S[k]=DEF[k];
    if(k==="fam"){S.gen="";S.sp="";S.ind="";}
    if(k==="gen"){S.sp="";S.ind="";}
    render();});
  document.getElementById("rstAll").onclick=()=>{const tab=S.tab,lang=S.lang;S=Object.assign({},DEF);S.tab=tab;S.lang=lang;render();};
}

// ============ per-card SUBJECT + DISPLAY controls ============
function subjectBar(){
  const v=VIEWS[S.tab]; if(!v.subj.length&&!v.disp.length)return "";
  const opt=(val,lab,cur)=>`<option value="${esc(val)}"${String(cur)===String(val)?" selected":""}>${esc(lab)}</option>`;
  let h=`<span class="tier t2">${t('subject')} SUBJECT</span>`;
  if(SUBJ_OF("phase"))h+=`<span class="pseg" id="phSeg">`+["leaf","flower","fruit"].map(p=>`<button data-p="${p}" class="${S.phase===p?'on':''}">${phName(p)}</button>`).join("")+`</span>`;
  const base=inScopeBase();
  // 排列順序：搜尋物種 → 科 → 屬 → 種 → 個體 → 形相 → 保育 → 特有。
  if(SUBJ_OF("tax")){
    // 科、屬選單依物種數降冪排序，同數比個體數，再按名稱；選項標「n 種」。
    const tally=(inds,key)=>{const m=new Map();
      inds.forEach(i=>{const k=i[key];if(!k)return;let e=m.get(k);if(!e){e={n:0,sp:new Set()};m.set(k,e);}e.n++;if(i.species)e.sp.add(i.species);});
      return m;};
    const bySp=m=>[...m.keys()].sort((a,b)=>m.get(b).sp.size-m.get(a).sp.size||m.get(b).n-m.get(a).n||a.localeCompare(b,"zh-Hant"));
    const spLab=(m,k,en)=>{const e=m.get(k);return (EN()?(en[k]||k):k)+(EN()?` (${e.sp.size} ${e.sp.size===1?"sp":"spp"})`:`（${e.sp.size} 種）`);};
    const famT=tally(base,"fam"), fams=bySp(famT), famLab=f=>spLab(famT,f,FAMS);
    const gb=base.filter(i=>!S.fam||i.fam===S.fam);
    const genT=tally(gb,"gen"), gens=bySp(genT), genLab=g=>spLab(genT,g,GENS);
    const sb=gb.filter(i=>!S.gen||i.gen===S.gen); let sps=uniq(sb.map(i=>i.species));
    const q=spQuery();
    if(q)sps=sps.filter(x=>spMatch(x,q));
    h+=`<label class="mini"><span>🔍</span><input id="fSpq" type="search" placeholder="${t('spSearch')}" value="${esc(S.spq)}"></label>`;
    h+=`<label class="mini"><span>${t('lFam')}</span><select id="fFam">${opt("",t('allFam')+" ("+fams.length+")",S.fam)+fams.map(f=>opt(f,famLab(f),S.fam)).join("")}</select></label>`;
    h+=`<label class="mini"><span>${t('lGen')}</span><select id="fGen">${opt("",t('allGen'),S.gen)+gens.map(g=>opt(g,genLab(g),S.gen)).join("")}</select></label>`;
    h+=`<label class="mini"><span>${t('lSp')}</span><select id="fSp">${opt("",t('allSp')+(q?` (${sps.length})`:""),S.sp)+sps.map(x=>opt(x,spDisp(x),S.sp)).join("")}</select></label>`;
  }
  if(SUBJ_OF("ind")){
    const list=inScope().slice().sort((a,b)=>a.seq-b.seq);
    h+=`<label class="mini"><span>${t('lInd')}</span><select id="fInd">${opt("",t('pickInd')+" ("+list.length+")",S.ind)+list.map(i=>opt(i.uid,i.uid+" · "+indName(i),S.ind)).join("")}</select></label>`;
  }
  if(SUBJ_OF("form")){
    const ks=uniq(base.map(i=>formKey(i.form)));
    h+=`<label class="mini"><span>${t('lForm')}</span><select id="fForm">${opt("",t('allForm'),S.form)+ks.map(k=>opt(k,formLabel(k+"-"),S.form)).join("")}</select></label>`;
  }
  if(SUBJ_OF("cons")){
    const cb=base, cats=[["","consAll"],["any","consAny"],["iucn","consIucn"],["redlist","consRed"],["cites","consCites"],["protected","consProt"],["sensitive","consSens"]];
    h+=`<label class="mini"><span>${t('lCons')}</span><select id="fCons">`+cats.map(([val,key])=>{const n=val?cb.filter(i=>consMatch(i,val)).length:0;return opt(val,t(key)+(val?` (${n})`:""),S.cons);}).join("")+`</select></label>`;
  }
  if(SUBJ_OF("endemic"))h+=`<label class="mini"><input type="checkbox" id="fEnd" ${S.endemic?"checked":""} style="width:14px;accent-color:var(--accent)"> ${t('onlyEndemic')}</label>`;
  if(v.disp.length)h+=`<span class="gearwrap"><button class="gear" id="gearBtn">${t('gear')}</button><div class="pop" id="pop" style="display:none">${displayPop()}</div></span>`;
  return `<div class="subj">${h}</div>`;
}
function displayPop(){

  if(DISP_OF("nstrip"))h+=`<div class="r"><span>${t('dNstrip')}</span><input type="checkbox" data-ck="nstrip" ${S.nstrip?"checked":""}></div>`;

  if(DISP_OF("covYear"))h+=`<div class="r"><span>${EN()?"Year":"年份"}</span><span class="tog" id="dCov">`+YEARS.map(y=>`<button data-v="${y}" class="${S.covYear===y?'on':''}">${y}</button>`).join("")+`</span></div>`;

}
function wireCard(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e[ev]=fn;};
  document.querySelectorAll("#phSeg button").forEach(b=>b.onclick=()=>{S.phase=b.dataset.p;render();});
  on("fFam","onchange",e=>{S.fam=e.target.value;S.gen="";S.sp="";S.ind="";render();});
  on("fGen","onchange",e=>{S.gen=e.target.value;S.sp="";S.ind="";render();});
  on("fSp","onchange",e=>{S.sp=e.target.value;S.ind="";render();});
  on("fForm","onchange",e=>{S.form=e.target.value;render();});
  on("fCons","onchange",e=>{S.cons=e.target.value;render();});
  on("fEnd","onchange",e=>{S.endemic=e.target.checked;render();});
  on("fInd","onchange",e=>{S.ind=e.target.value;render();});
  document.querySelectorAll(".pki").forEach(b=>b.onclick=()=>{S.ind=b.dataset.uid;render();
    document.getElementById("view").scrollIntoView({block:"start",behavior:"smooth"});});
  const q=document.getElementById("fSpq");
  if(q){
    // 注音等輸入法組字期間不重繪：重繪會換掉 input 元素，候選字窗隨之消失而無法選字。
    // 組字結束（compositionend）後才套用；Chrome 與 Firefox 事件順序不同，以值比對避免重複重繪。
    let composing=false;
    const apply=v=>{if(v===S.spq)return;S.spq=v;S.sp="";render();
      const n=document.getElementById("fSpq");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
    q.addEventListener("compositionstart",()=>{composing=true;});
    q.addEventListener("compositionend",e=>{composing=false;apply(e.target.value);});
    q.oninput=e=>{if(composing||e.isComposing)return;apply(e.target.value);};
  }
  on("gearBtn","onclick",()=>{const p=document.getElementById("pop");p.style.display=p.style.display==="none"?"block":"none";});
  document.querySelectorAll("#dThr button").forEach(b=>b.onclick=()=>{S.thr=Number(b.dataset.v);render();});
  document.querySelectorAll("#dDen button").forEach(b=>b.onclick=()=>{S.denom=b.dataset.v;render();});
  document.querySelectorAll("#dMin button").forEach(b=>b.onclick=()=>{S.minN=Number(b.dataset.v);render();});
  document.querySelectorAll("#dSeq button").forEach(b=>b.onclick=()=>{S.seqYear=b.dataset.v;render();});
  document.querySelectorAll("#dCov button").forEach(b=>b.onclick=()=>{S.covYear=b.dataset.v;render();});
  document.querySelectorAll("#pop input[data-ck]").forEach(c=>c.onchange=()=>{S[c.dataset.ck]=c.checked;render();});
}
function card(title,desc,body,extra){
  return `<div class="card"><div class="chead"><div><h2>${title}</h2><div class="desc">${desc||""}</div></div><div class="sp"></div>${subjectBar()}</div>${body}${extra||""}</div>`;
}

// ============ SVG helpers ============
function svg(w,h){return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;font-size:11px">`;}
function txt(x,y,s,o){o=o||{};return `<text x="${x}" y="${y}" fill="${o.fill||css('--muted')}" text-anchor="${o.a||'start'}" font-size="${o.fs||11}" font-weight="${o.fw||400}">${s}</text>`;}
function ln(x1,y1,x2,y2,c,w){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w||1}"/>`;}
const HATCH=`<defs><pattern id="hat" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f0ede2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d6d1c0" stroke-width="2.5"/></pattern></defs>`;

// ============ CSV ============
function exportCSV(){
  const sc=inScope(), ys=yearsInPlay(), rows=[["uid","編號","名稱","物種","學名","科","屬","形相","步道側","路段","存活","年","物候相","月","踏查日","代號"]];
  sc.forEach(i=>ys.forEach(y=>{const o=i.obs[y];if(!o)return;
    ["leaf","flower","fruit"].forEach(p=>o[p].forEach((v,m)=>{if(v==null)return;
      rows.push([i.uid,i.rid,i.name.replace(/\n/g,"／"),i.species,i.sci||"",i.fam||"",i.gen||"",formLabel(i.form),i.side||"",i.segment||"",i.alive===false?"0":"1",y,p,m+1,surveyDay(y,m)||"",v]);}));}));
  const csv="﻿"+rows.map(r=>r.map(c=>{const s=String(c==null?"":c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")).join("\n");

  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));

// ===================== VIEW: 本月 =====================
function curMonth(){
  let y=LAST,m=null;
  const a=(M.asof||"").match(/^(\d{4})-(\d{2})/);
  if(a&&YEARS.includes(a[1])){y=a[1];m=Number(a[2])-1;}
  if(m==null||!SURVEYED[y][m]){for(let k=11;k>=0;k--)if(SURVEYED[y][k]){m=k;break;}}
  return {y,m:(m==null?0:m)};
}
function viewNow(){
  const {y,m}=curMonth(), sc=inScope();
  // 分母與群落物候曲線相同：該月有踏查、該株當年受監測、且該月未標「已不在」。
  // 踏查團隊 2026-11 決定空白＝「調查過但沒有」，所以不能只數剛好有填值的那幾株。
  const tally=p=>{let n=0,rec=0,act=0,peak=0;
    sc.forEach(i=>{const o=i.obs[y];if(!o)return;
      const monitored=["leaf","flower","fruit"].some(q=>o[q].some(v=>v!=null));
      const gone=((i.gone&&i.gone[y])||[])[m];
      if(!monitored||gone||!SURVEYED[y][m])return;
      n++;const v=o[p][m];if(v==null)return;rec++;if(v>=2)act++;if(v>=3)peak++;});
    return{n,rec,act,peak};};
  const L=tally("leaf"),F=tally("flower"),R=tally("fruit");
  const cl=M.changelog||{};
  const hot=p=>sc.filter(i=>{const o=i.obs[y];return o&&o[p][m]!=null&&o[p][m]>=3;})
                 .map(i=>indName(i).split("／")[0]);
  const cov=SURVEYED[y].filter(Boolean).length;
  const pct=(a,b)=>b?Math.round(100*a/b):0;
  const ins=`<div class="ins">
    <div class="ic"><div class="k">${EN()?"THIS MONTH":"本月變動"}</div>
      <div class="v">${(cl.prev_n!=null&&!cl.cleanup)?`${EN()?"Individuals":"個體"} ${cl.prev_n} → <b>${cl.n}</b>`:`<b>${M.n_individuals}</b> ${EN()?"individuals":"株個體"}`}</div>
      <div class="m">${Object.keys(cl.by_year||{}).length?`${EN()?"new values":"新增物候值"} `+Object.entries(cl.by_year).map(([k,v])=>`${k} ${v>0?"+":""}${v}`).join(" · "):(EN()?"no change since last refresh":"與上次重建無差異")}${(cl.new_species||[]).length?` · ${EN()?"new species":"新物種"} ${cl.new_species.length}`:""}</div>
      ${cl.cleanup?`<div class="m">${EN()?`Data tidy-up: ${cl.cleanup.n} individuals removed from unmonitored segments (${cl.cleanup.segments.join(", ")}); not a field change.`:`資料整理：移除未定期踏查路段（${cl.cleanup.segments.join("、")}）${cl.cleanup.n} 株，非現地變化。`}</div>`:""}</div>
    <div class="ic b"><div class="k">${EN()?"IN FLOWER / FRUIT NOW":"本月花果"}</div>
      <div class="v"><em>${F.act}</em> ${EN()?"flowering":"株開花中"} · <em>${R.act}</em> ${EN()?"fruiting":"株結果中"}</div>
      <div class="m">${EN()?"at peak":"達盛期"}: ${EN()?"flower":"花"} ${F.peak} · ${EN()?"fruit":"果"} ${R.peak} ｜ ${EN()?"new leaf":"新葉"} ${L.act}</div></div>
    <div class="ic c"><div class="k">${EN()?"DATA QUALITY":"資料品質"}</div>
      <div class="v">${y} ${EN()?"surveyed":"已調查"} <b>${cov}</b> / 12 ${EN()?"months":"個月"}</div>
      <div class="m">${EN()?"records this month":"本月有紀錄"} ${Math.max(L.rec,F.rec,R.rec)} / ${L.n} ${EN()?"monitored":"株受監測"} · ${EN()?"unreadable cells":"無法解析儲存格"} ${M.unreadable||0}</div></div></div>`;
  const rows=[["flower",hot("flower")],["fruit",hot("fruit")]].map(([p,list])=>
    `<tr><td style="white-space:nowrap"><b>${phName(p)}</b> ${EN()?"at peak":"盛期"}</td>
       <td>${list.length?list.slice(0,24).map(esc).join("、")+(list.length>24?` …（${list.length}）`:""):`<span class="muted">${EN()?"none this month":"本月無"}</span>`}</td></tr>`).join("");
  const body=`${ins}<table class="tbl"><tr><th style="width:130px">${EN()?"Phenophase":"物候相"}</th><th>${EN()?"Species at peak this month":"本月達盛期的物種"}</th></tr>${rows}</table>
    <div class="note">${EN()?`Share of individuals reaching state ≥2 this month — leaf ${pct(L.act,L.n)}%, flower ${pct(F.act,F.n)}%, fruit ${pct(R.act,R.n)}% (n = ${L.n} individuals monitored in ${y}/${m+1}; a blank cell counts as absent, as in the community curve).`
      :`本月達狀態 ≥2 的比例 — 葉 ${pct(L.act,L.n)}%、花 ${pct(F.act,F.n)}%、果 ${pct(R.act,R.n)}%（分母為 ${y} 年 ${m+1} 月受監測的 ${L.n} 株；空白＝調查過但沒有，與群落物候曲線相同）。`}</div>`;
  return card(`${t('vNow')} · ${y} / ${m+1}`,
    EN()?"What is happening on the ridge right now, from the latest surveyed month.":"以最近一次有踏查紀錄的月份，回答「這個月山上在發生什麼」。",body);
}

// ===================== VIEW: 調查覆蓋 =====================
function viewCoverage(){
  const y=S.yr||S.covYear, sc=inScope().slice().sort((a,b)=>String(a.seg||"").localeCompare(String(b.seg||""))||a.seq-b.seq);
  if(!sc.length)return card(t('vCov'),"",`<div class="empty">${EN()?"No individuals in scope.":"範圍內沒有個體。"}</div>`);
  const cell=13,padL=168,padT=22,W=padL+12*cell+120,rowH=cell;
  let groups=[],cur=null;
  sc.forEach(i=>{const g=i.segment||"—";if(!cur||cur.seg!==g){cur={seg:g,items:[]};groups.push(cur);}cur.items.push(i);});
  const H=padT+sc.length*rowH+groups.length*16+16;
  let s=svg(W,H)+HATCH;
  MONTHS.forEach((mm,k)=>s+=txt(padL+k*cell+cell/2,padT-7,mm,{a:"middle"}));
  let yy=padT, miss=0, perMonth=Array(12).fill(0);
  groups.forEach(g=>{
    s+=txt(0,yy+10,esc(g.seg),{fs:10.5,fw:600,fill:css('--accent')});yy+=16;
    g.items.forEach(i=>{
      const o=i.obs[y], nm=indName(i).split("／")[0];
      s+=txt(padL-7,yy+cell-3,`${i.uid} ${nm.length>9?nm.slice(0,9)+"…":nm}`,{a:"end",fs:9.5,fill:i.alive===false?css('--muted'):css('--ink')});
      let got=0; const gy=(i.gone&&i.gone[y])||[];
      for(let m=0;m<12;m++){
        const v=o?o[S.phase][m]:null, x=padL+m*cell;
        const un=!SURVEYED[y][m];
        const fill=gy[m]?"#e2dfd5":(v!=null?css(PHASE[S.phase].cols[Math.max(0,Math.min(2,v-1))]):(un?"url(#hat)":"#fff"));
        s+=`<rect x="${x+1}" y="${yy+1}" width="${cell-2}" height="${cell-2}" rx="2.5" fill="${fill}" stroke="${css('--line')}" stroke-width=".7"/>`;
        if(v!=null){got++;perMonth[m]++;}
      }
      if(!got){miss++;s+=txt(padL+12*cell+8,yy+cell-3,EN()?"no record":"整年無紀錄",{fs:9.5,fill:css('--brand-red')});}
      else s+=txt(padL+12*cell+8,yy+cell-3,`${got}/12`,{fs:9.5});
      yy+=rowH;});
  });
  s+="</svg>";
  const covMonths=SURVEYED[y].filter(Boolean).length;
  const body=`<div class="statbar"><span>${EN()?"Year":"年度"} <b>${y}</b></span><span>${EN()?"Individuals in scope":"範圍內個體"} <b>${sc.length}</b></span>
     <span>${EN()?"Months surveyed":"已調查月份"} <b>${covMonths}/12</b></span><span>${EN()?"With no record all year":"整年無紀錄"} <b style="color:${miss?css('--brand-red'):css('--ink')}">${miss}</b></span>
     <span>${EN()?"Survey dates":"踏查日"} <b>${MONTHS.map((m,k)=>surveyDay(y,k)?`${k+1}/${surveyDay(y,k)}`:null).filter(Boolean).join("、")||"—"}</b></span></div>
   <div class="scroll">${s}</div>
   <div class="legend"><span class="swatch"><i style="background:${css(PHASE[S.phase].cols[0])}"></i>1</span><span class="swatch"><i style="background:${css(PHASE[S.phase].cols[1])}"></i>2</span><span class="swatch"><i style="background:${css(PHASE[S.phase].cols[2])}"></i>3</span>
     <span class="swatch"><i style="background:#f0ede2;border:1px solid #d6d1c0"></i>${t('unsurveyed')}</span><span class="swatch"><i style="background:#fff;border:1px solid ${css('--line')}"></i>${t('absent')}</span><span class="swatch"><i style="background:#e2dfd5"></i>✕ ${t('goneLab')}</span></div>
   <div class="note">${EN()?"Monthly record counts: ":"各月有紀錄株數："}${perMonth.map((n,k)=>`${k+1}月 ${n}`).join(" · ")}</div>`;
  return card(`${t('vCov')} · ${phName(S.phase)} · ${y}`,
    EN()?"Which individuals and which months still have no record — the field team's working view.":"斜線＝該月整隊未踏查；白格＝調查過但沒有（團隊 2026-11 決定的讀法）；✕＝該月該株已不在。只有整年空白的株才是真的沒被記到。",body);
}

// ===================== VIEW: 群落物候曲線 =====================
function viewCommunity(){
  const sc=inScope(), ys=yearsInPlay();
  const ser=ys.map(y=>{
    // 踏查團隊 2026-11 決定：該月有踏查時，受監測個體的空白＝「調查過但沒有」。
    // 分母因此是當月受監測的整個族群，不是剛好有填那一格的少數幾株。
    let num=Array(12).fill(0),rec=Array(12).fill(0),surv=Array(12).fill(0),denY=0;
    sc.forEach(i=>{const o=i.obs[y];if(!o)return;const a=o[S.phase];
      const g=(i.gone&&i.gone[y])||[];
      const monitored=["leaf","flower","fruit"].some(p=>o[p].some(v=>v!=null));
      if(monitored)denY++;
      for(let m=0;m<12;m++){
        if(g[m])continue;                       // 該月該株已不在，不進任何分母
        if(a[m]!=null)rec[m]++;
        if(monitored&&SURVEYED[y][m])surv[m]++;
        if(a[m]!=null&&a[m]>=S.thr)num[m]++;
      }});
    const base=m=>S.denom==="surveyed"?surv[m]:(S.denom==="recorded"?rec[m]:denY);
    return {y,den:rec,rec,surv,denY,pct:num.map((c,m)=>{const d=base(m);return (d&&d>=S.minN)?100*c/d:null;})};
  });
  const W=760,padL=46,padR=16,padT=16,PH=228,NH=S.nstrip?54:12,H=padT+PH+NH+34;
  const X=m=>padL+18+((W-padL-padR-36)*(m/11)), Y=p=>padT+PH*(1-p/100);
  let s=svg(W,H)+HATCH;
  if(S.markUn){const ref=ys[ys.length-1];
    for(let m=0;m<12;m++)if(!SURVEYED[ref][m]){
      const x0=X(m)-((X(1)-X(0))/2);
      s+=`<rect x="${x0}" y="${padT}" width="${X(1)-X(0)}" height="${PH}" fill="url(#hat)"/>`;
      s+=txt(X(m),padT+13,t('unsurveyed'),{a:"middle",fs:9.5,fill:"#8a8575"});}}
  [0,25,50,75,100].forEach(g=>{s+=ln(padL,Y(g),W-padR,Y(g),css('--line'))+txt(padL-6,Y(g)+3,g+"%",{a:"end"});});
  MONTHS.forEach((m,k)=>s+=txt(X(k),padT+PH+16,m,{a:"middle"}));
  ser.forEach(se=>{
    let p="";se.pct.forEach((v,m)=>{if(v==null)return;p+=(p?"L":"M")+X(m)+" "+Y(v);});
    if(!p)return;
    const last=se.y===ys[ys.length-1];
    s+=`<path d="${p}" fill="none" stroke="${YCOL[se.y]}" stroke-width="${last?2.6:1.8}" stroke-linejoin="round"/>`;
    if(last)se.pct.forEach((v,m)=>{if(v!=null)s+=`<circle cx="${X(m)}" cy="${Y(v)}" r="3" fill="${YCOL[se.y]}"/>`;});
  });
  if(S.nstrip){
    const ref=ser[ser.length-1],base=padT+PH+NH+2;
    const dvec=S.denom==="surveyed"?ref.surv:ref.rec;
    const mx=Math.max(1,...dvec);
    s+=ln(padL,base,W-padR,base,"#e2dece")+txt(padL-6,base+4,"n",{a:"end"});
    dvec.forEach((n,m)=>{const bw=Math.min(26,(X(1)-X(0))*0.7),bh=n?Math.max(2,(n/mx)*26):0;
      s+=`<rect x="${X(m)-bw/2}" y="${base-bh}" width="${bw}" height="${bh}" rx="2" fill="${n>=S.minN?'#cfd9bb':(n?'#e8e2cc':'#e6e3d8')}"/>`;
      s+=txt(X(m),base+14,n||"—",{a:"middle",fs:9.5,fill:n?css('--muted'):"#b2b2b2"});});
  }
  s+="</svg>";
  const lab=phLabs(S.phase);
  const dname=S.denom==="surveyed"?t('dSurvey'):(S.denom==="recorded"?t('dPhase'):t('dYear'));
  const desc=EN()?`Share of individuals reaching “${S.thr===3?lab[2]:lab[1]}”${S.thr===3?" (state 3)":" or above (state ≥2)"} each month. Denominator = ${dname}; months with n &lt; ${S.minN} are not plotted.`
                 :`各月達「${S.thr===3?lab[2]:lab[1]}」${S.thr===3?"（狀態 3）":"以上（狀態 ≥2）"}的個體比例。分母＝${dname}；n &lt; ${S.minN} 的月份不繪製。`;
  const leg=`<div class="legend">`+ys.map(y=>`<span class="swatch"><i style="background:${YCOL[y]};border-radius:50%"></i>${y}</span>`).join("")+
    (S.markUn?`<span class="swatch"><i style="background:#f0ede2;border:1px solid #d6d1c0"></i>${t('unsurveyed')}（≠ ${EN()?"absent":"無"}）</span>`:"")+
    `<span style="margin-left:auto">${EN()?"in scope":"符合條件"}：<b>${sc.length}</b> ${EN()?"individuals":"株"}</span></div>`;
  const note=`<div class="note"><b>${EN()?"How a blank is read":"空白怎麼算"}</b> ${EN()
    ? "The survey team settled this in Nov 2026: in a month that was surveyed, a blank phenophase means <b>recorded as absent</b>, not missing. The denominator is therefore every monitored individual that month, not just those with a value written in. Months the team did not walk are excluded, and so are individuals marked <b>gone that month</b> (X). The conservative alternative is kept under ⚙ for comparison."
    : "踏查團隊 2026-11 決定：<b>該月有踏查時，空白代表「調查過但沒有」</b>，不是漏記。分母因此是當月受監測的每一株，而不是只有填了值的那幾株。整隊沒走的月份不計入，標記<b>該月已不在</b>（X）的株也不計入。保守算法保留在 ⚙ 供對照。"}</div>`;
  return card(`${t('vCom')} · ${phName(S.phase)}`,desc,`<div class="scroll">${s}</div>`,leg+note);
}

// ===================== VIEW: 物候期起始位移 =====================
function onsetTable(){
  const sc=inScope(), bySp={};
  sc.forEach(i=>{(bySp[i.species]=bySp[i.species]||[]).push(i);});
  const rows=[];
  Object.keys(bySp).forEach(sp=>{
    const per={};
    YEARS.forEach(y=>{
      const vals=[];
      bySp[sp].forEach(i=>{const o=i.obs[y];if(!o)return;const a=o[S.phase];
        for(let m=0;m<12;m++)if(a[m]!=null&&a[m]>=S.thr){vals.push(monthFrac(y,m));break;}});
      if(vals.length){vals.sort((x,z)=>x-z);per[y]=vals[Math.floor(vals.length/2)];}
    });
    const ks=Object.keys(per);
    if(ks.length>=2){
      const xs=ks.map(Number),ys2=ks.map(k=>per[k]);
      const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys2.reduce((a,b)=>a+b,0)/n;
      let num=0,den=0;xs.forEach((x,k)=>{num+=(x-mx)*(ys2[k]-my);den+=(x-mx)*(x-mx);});
      rows.push({sp,per,slope:den?num/den:0,mean:my,nyr:n,ex:bySp[sp][0]});
    }
  });
  rows.sort((a,b)=>a.mean-b.mean);
  return rows;
}
function viewOnset(){
  const all=onsetTable(), rows=all.slice(0,16);
  if(!rows.length)return card(t('vOns'),"",`<div class="empty">${EN()?"Need at least two years of onset per species. Relax the filters or lower the threshold.":"每個物種至少要有兩年的起始時間。請放寬篩選或降低門檻。"}</div>`);
  const W=760,padL=172,padR=78,padT=26,rowH=30,H=padT+rows.length*rowH+30;
  const X=m=>padL+((W-padL-padR)*((m)/11));
  let s=svg(W,H);
  for(let m=0;m<12;m++){s+=ln(X(m),padT-8,X(m),padT+rows.length*rowH-12,"#eae6da");s+=txt(X(m),padT-14,m+1,{a:"middle"});}
  s+=txt(W-padR+10,padT-14,EN()?"mo/yr":"月/年",{fs:10});
  rows.forEach((r,k)=>{
    const y0=padT+k*rowH+6, vals=Object.values(r.per), mn=Math.min(...vals), mx=Math.max(...vals);
    const nm=EN()?(r.ex.sci||r.sp):r.sp;
    s+=txt(0,y0+2,esc(nm.length>13?nm.slice(0,13)+"…":nm),{fill:css('--ink'),fw:600,fs:11.5});
    s+=txt(0,y0+14,esc(famDisp(r.ex)),{fs:9.5});
    s+=ln(X(mn),y0,X(mx),y0,"#ddd8ca",5);
    const lastY=Object.keys(r.per).sort().pop(), lv=r.per[lastY];
    const lm=Math.floor(lv), prev=(function(){for(let m=lm-1;m>=0;m--)if(SURVEYED[lastY][m])return monthFrac(lastY,m);return null;})();
    if(prev!=null){s+=ln(X(prev),y0,X(lv),y0,"#e8380d",1.3);
      [prev,lv].forEach(v=>s+=ln(X(v),y0-4,X(v),y0+4,"#e8380d",1.3));}
    Object.keys(r.per).sort().forEach(y=>{const isLast=y===lastY;
      s+=`<circle cx="${X(r.per[y])}" cy="${y0}" r="${isLast?5.5:4.2}" fill="${YCOL[y]}" stroke="#fff" stroke-width="1.4"/>`;});
    if(r.nyr<3){s+=txt(W-padR+10,y0+4,`n=${r.nyr}`,{fill:css('--muted'),fs:11});}
    else{const col=r.slope<-0.05?"#e8380d":(r.slope>0.05?css('--accent'):css('--muted'));
      const arr=r.slope<-0.05?"◀":(r.slope>0.05?"▶":"•");
      s+=txt(W-padR+10,y0+4,`${arr} ${r.slope>0?"+":""}${r.slope.toFixed(2)}`,{fill:col,fw:600,fs:11.5});}
  });
  s+="</svg>";
  const fit=all.filter(r=>r.nyr>=3);
  const nE=fit.filter(r=>r.slope<-0.05).length,nL=fit.filter(r=>r.slope>0.05).length,nF=fit.length-nE-nL;
  const leg=`<div class="legend">`+YEARS.map(y=>`<span class="swatch"><i style="background:${YCOL[y]};border-radius:50%"></i>${y}</span>`).join("")+
    `<span>├─┤ ${EN()?"onset uncertainty = gap between the two surveys that bracket it":"起始不確定區間＝夾住起始的前後兩次踏查日間距"}</span></div>`;
  const note=`<div class="note"><b>${EN()?"Reading this":"怎麼讀"}：</b>${EN()
    ? `onset = first month at state ≥${S.thr}, median across the species' individuals, placed on the actual survey date. A slope is only fitted where a species has ≥3 years (${fit.length} of ${all.length}): ${nE} earlier, ${nL} later, ${nF} flat; the rest show n=2. A ${YEARS.length}-year series is too short to infer a climate trend — read it as a record, not a projection.`
    : `起始＝該年首次達狀態 ≥${S.thr} 的月份，取該物種各株的中位數，並以實際踏查日定位。斜率只在物種有 ≥3 年資料時才估計（${all.length} 個中的 ${fit.length} 個）：提早 ${nE}、延後 ${nL}、持平 ${nF}；其餘標示 n=2。${YEARS.length} 年序列不足以推論氣候趨勢，請當作紀錄而非預測。`}
    ${all.length>rows.length?`<br>${EN()?"Showing the ":"僅顯示起始最早的 "}${rows.length}${EN()?" earliest-onset species of ":" 個物種（共 "}${all.length}${EN()?".":" 個）。"}`:""}</div>`;
  return card(`${t('vOns')} · ${phName(S.phase)}`,
    EN()?"Has the start of the phenophase moved? One row per species, one dot per year, slope in months per year.":"物候期的起始時間有沒有在移動？每列一個物種、每點一年，右側為線性斜率（月／年）。",
    `<div class="scroll">${s}</div>`,leg+note);
}

// ===================== VIEW: 分類年際趨勢 =====================
function activeMonths(inds,year,phase,thr){
  let counts=Array(12).fill(0),denom=0;
  inds.forEach(i=>{const o=i.obs[year];if(!o)return;const a=o[phase];
    if(a.some(v=>v!=null)){denom++;a.forEach((v,m)=>{if(v!=null&&v>=thr)counts[m]++;});}});
  return {counts,denom};
}
function scopeTitle(){
  if(S.sp)return spDisp(S.sp);
  if(S.gen)return EN()?(GENS[S.gen]||S.gen):S.gen;
  if(S.fam)return EN()?(FAMS[S.fam]||S.fam):S.fam;
  return EN()?"All in scope":"全部範圍";
}
function viewTaxon(){
  const sc=inScope(),lab=phLabs(S.phase),ys=yearsInPlay();
  const W=760,padL=56,padR=92,rowH=30,padT=22,iw=W-padL-padR,H=padT+ys.length*rowH+30;
  const X=m=>padL+iw*(m/11);
  let s=svg(W,H);
  MONTHS.forEach((m,k)=>s+=txt(X(k),padT-7,m,{a:"middle"}));
  ys.forEach((y,r)=>{
    const cy=padT+r*rowH+rowH/2;
    s+=txt(padL-10,cy+4,y,{a:"end",fill:css('--ink'),fw:600});
    const am=activeMonths(sc,y,S.phase,2),pk=activeMonths(sc,y,S.phase,3);
    if(!am.denom){s+=txt(padL,cy+4,t('noObs'),{fs:11});return;}
    const mon=am.counts.map((c,m)=>c>0?m:-1).filter(m=>m>=0);
    if(!mon.length){s+=txt(padL,cy+4,EN()?"(none reached)":"（該年無達標）",{fs:11});return;}
    const a=Math.min(...mon),b=Math.max(...mon);
    s+=`<rect x="${X(a)}" y="${cy-7}" width="${Math.max(4,X(b)-X(a))}" height="14" rx="7" fill="${css(PHASE[S.phase].cols[1])}" opacity=".55"/>`;
    pk.counts.forEach((c,m)=>{if(c>0)s+=`<circle cx="${X(m)}" cy="${cy}" r="${3+5*(pk.denom?c/pk.denom:0)}" fill="${css(PHASE[S.phase].cols[2])}"/>`;});
    s+=txt(W-padR+8,cy+4,EN()?`Mon ${a+1}–${b+1}`:`第 ${a+1}–${b+1} 月`,{fs:11});
  });
  s+="</svg>";
  const leg=`<div class="legend"><span class="swatch"><i style="background:${css(PHASE[S.phase].cols[1])};opacity:.55"></i>${EN()?`Active (≥ ${lab[1]})`:`活躍期（${lab[1]}以上）`}</span>
    <span class="swatch"><i style="background:${css(PHASE[S.phase].cols[2])};border-radius:50%"></i>${EN()?"Peak (larger = higher %)":"盛期（點越大＝比例越高）"}</span>
    <span style="margin-left:auto">${EN()?"individuals":"涵蓋個體"} <b>${sc.length}</b></span></div>`;
  return card(`${t('vTax')} · ${scopeTitle()} · ${phName(S.phase)}`,
    EN()?"Active span and peak of the selected taxon, year by year.":"所選分類在各年的活躍區間與盛期；在上方切換科／屬／物種即可上捲。",
    `<div class="scroll">${s}</div>`,leg);
}

// ===================== VIEW: 跨物種季節序列 =====================
function viewSequence(){
  const yr=S.yr||S.seqYear,lab=phLabs(S.phase);
  const sc=inScope().filter(i=>i.obs[yr]&&i.obs[yr][S.phase].some(v=>v!=null));
  let rows=sc.map(i=>{const a=i.obs[yr][S.phase];let best=-1,bm=null;
    a.forEach((v,m)=>{if(v!=null&&v>best){best=v;bm=m;}});
    const mon=a.map((v,m)=>v!=null&&v>=S.thr?m:-1).filter(m=>m>=0);
    return {i,peak:bm,best,first:mon.length?Math.min(...mon):bm,last:mon.length?Math.max(...mon):bm};})
    .filter(r=>r.peak!=null&&r.best>=S.thr);
  rows.sort((x,y)=>(x.first-y.first)||(x.peak-y.peak));
  if(!rows.length)return card(`${t('vSeq')} · ${phName(S.phase)} · ${yr}`,"",
    `<div class="empty">${EN()?`No individual reached “${lab[S.thr-1]}” in ${yr} for this scope.`:`此範圍在 ${yr} 年沒有達『${lab[S.thr-1]}』的個體。可切換年份、物候相或放寬篩選。`}</div>`);
  const W=760,padL=EN()?190:156,padR=58,padT=18,rh=15,iw=W-padL-padR,LIM=EN()?28:17,H=padT+rows.length*rh+28;
  const X=m=>padL+iw*(m/11);
  let s=svg(W,H);
  MONTHS.forEach((m,k)=>{s+=txt(X(k),padT-4,m,{a:"middle"});s+=ln(X(k),padT,X(k),H-24,css('--line'));});
  rows.forEach((r,k)=>{const cy=padT+k*rh+rh/2;
    const nm=(EN()?(r.i.sci||r.i.name.split("\n")[0]):r.i.name.split("\n")[0])+" · "+famDisp(r.i);
    s+=txt(padL-8,cy+3,esc(nm.length>LIM?nm.slice(0,LIM)+"…":nm),{a:"end",fs:10,fill:css('--ink')});
    s+=`<rect x="${X(r.first)}" y="${cy-4}" width="${Math.max(3,X(r.last)-X(r.first))}" height="8" rx="4" fill="${css(PHASE[S.phase].cols[1])}" opacity=".5"/>`;
    s+=`<circle cx="${X(r.peak)}" cy="${cy}" r="${r.best>=3?4.5:3}" fill="${css(PHASE[S.phase].cols[Math.max(0,Math.min(2,r.best-1))])}"/>`;});
  s+="</svg>";
  const leg=`<div class="legend"><span class="swatch"><i style="background:${css(PHASE[S.phase].cols[1])};opacity:.5"></i>${EN()?"Active span":"活躍區間"}</span>
    <span class="swatch"><i style="background:${css(PHASE[S.phase].cols[2])};border-radius:50%"></i>${EN()?"Peak":"盛期峰值"}</span>
    <span style="margin-left:auto">${rows.length} ${EN()?"individuals":"株"}</span></div>`;
  return card(`${t('vSeq')} · ${phName(S.phase)} · ${yr}`,
    EN()?"Individuals ordered by onset month — the seasonal relay.":"依起始月排序，看誰先誰後的季節接力；在 ⚙ 切換年份可比較順序是否逐年改變。",
    `<div class="scroll">${s}</div>`,leg);
}

// ===================== VIEW: 物候重疊矩陣 =====================
function viewOverlap(){
  const yr=S.yr||S.seqYear, sc=inScope(), bySp={};
  sc.forEach(i=>{const o=i.obs[yr];if(!o)return;const a=o[S.phase];
    const set=bySp[i.species]=bySp[i.species]||new Set();
    a.forEach((v,m)=>{if(v!=null&&v>=S.thr)set.add(m);});});
  let sps=Object.keys(bySp).filter(k=>bySp[k].size>0);
  sps.sort((a,b)=>bySp[b].size-bySp[a].size);
  const N=Math.min(16,sps.length); sps=sps.slice(0,N);
  if(N<2)return card(`${t('vOvl')} · ${phName(S.phase)} · ${yr}`,"",
    `<div class="empty">${EN()?"Need at least two active species in this year/scope.":"此年度與範圍內需要至少兩個有活躍月份的物種。"}</div>`);
  sps.sort((a,b)=>Math.min(...bySp[a])-Math.min(...bySp[b]));
  const cell=26,padL=150,padT=150,W=padL+N*cell+16,H=padT+N*cell+54;
  let s=svg(W,H), mx=1;
  const inter=(a,b)=>[...bySp[a]].filter(m=>bySp[b].has(m)).length;
  sps.forEach((a,r)=>sps.forEach((b,c)=>{if(r!==c)mx=Math.max(mx,inter(a,b));}));
  const ramp=["#f2f0e6","#dde5c8","#bcd197","#90b821","#6d9427","#587a30"];
  sps.forEach((a,r)=>{
    const nm=EN()?(SPS[a]||a):a, lb=nm.length>14?nm.slice(0,14)+"…":nm;
    s+=txt(padL-8,padT+r*cell+cell/2+4,esc(lb),{a:"end",fs:10,fill:css('--ink')});
    s+=`<text x="${padL+r*cell+cell/2}" y="${padT-8}" fill="${css('--ink')}" font-size="10" text-anchor="start" transform="rotate(-90 ${padL+r*cell+cell/2} ${padT-8})">${esc(lb)}</text>`;
    sps.forEach((b,c)=>{
      const x=padL+c*cell,y=padT+r*cell;
      if(r===c){s+=`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="3" fill="#fff" stroke="${css('--line')}"/>`;
        s+=txt(x+cell/2,y+cell/2+4,bySp[a].size,{a:"middle",fs:10,fill:css('--muted')});return;}
      const v=inter(a,b), f=ramp[Math.min(ramp.length-1,Math.round((v/mx)*(ramp.length-1)))];
      s+=`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="3" fill="${v?f:'#fbfaf6'}" stroke="${css('--line')}" stroke-width=".7"/>`;
      if(v)s+=txt(x+cell/2,y+cell/2+4,v,{a:"middle",fs:10,fill:inkOn(f),fw:600});});
  });
  s+="</svg>";
  const leg=`<div class="legend">${EN()?"Shared active months":"共同活躍月數"}： `+ramp.map((c,k)=>`<span class="swatch"><i style="background:${c}"></i>${Math.round(k/(ramp.length-1)*mx)}</span>`).join("")+
    `<span style="margin-left:auto">${EN()?"diagonal = own active months":"對角線＝該物種自身活躍月數"}</span></div>`;
  return card(`${t('vOvl')} · ${phName(S.phase)} · ${yr}`,
    EN()?"Which species are active in the same months — the basis for host-plant and pollinator links.":"哪些物種在同樣的月份活躍；這是接上蝶類寄主與訪花者關係的基礎。",
    `<div class="scroll">${s}</div>`,leg);
}

// ===================== VIEW: 個體物候月曆 =====================
// 未選個體時的清單：依路段、踏查順序排列，標出最近一次有紀錄的年月。
function lastRecord(i){
  for(let r=YEARS.length-1;r>=0;r--){const y=YEARS[r],o=i.obs[y];if(!o)continue;
    for(let m=11;m>=0;m--)if(["leaf","flower","fruit"].some(p=>o[p][m]!=null))return `${y}/${m+1}`;}
  return null;}
function indPicker(){
  const sc=inScope().slice().sort((a,b)=>a.seq-b.seq);
  if(!sc.length)return `<div class="empty">${EN()?"No individuals in scope.":"範圍內沒有個體。"}</div>`;
  const groups=[];let cur=null;
  sc.forEach(i=>{const g=i.segment||"—";if(!cur||cur.seg!==g){cur={seg:g,items:[]};groups.push(cur);}cur.items.push(i);});
  return `<div class="picker">`+groups.map(g=>`<div class="pkg"><div class="pkh">${esc(g.seg)} <span class="muted">· ${g.items.length} ${EN()?"ind.":"株"}</span></div><div class="pkl">`+
    g.items.map(i=>{const lr=lastRecord(i);
      return `<button class="pki" data-uid="${esc(i.uid)}"><b>${esc(i.uid)}</b> ${esc(indName(i))}<span>${lr?(EN()?"last ":"最近 ")+lr:(EN()?"no record":"無紀錄")}${i.alive===false?(EN()?" · dead":" · 已枯死"):""}</span></button>`;}).join("")+
    `</div></div>`).join("")+`</div>`;
}

  const sb=EN()
    ?`<span>Sci. name <b><i>${esc(i.sci||"—")}</i></b></span><span>Family <b>${esc(i.fam_sci||i.fam||"—")}</b></span><span>Form <b>${formLabel(i.form)}</b></span><span>Side <b>${esc(i.side||"—")}</b></span><span>Segment <b>${esc(i.segment||"—")}</b></span><span>Observed <b>${oy}</b></span><span>${t('consStatus')} <b>${consStr(i)}</b></span>`
    :`<span>名錄正名 <b>${esc(i.zh||"—")}</b></span><span>科 <b>${esc(i.fam||"—")}</b></span><span>學名 <b><i>${esc(i.sci||"—")}</i></b></span><span>形相 <b>${formLabel(i.form)}</b></span><span>步道側 <b>${esc(i.side||"—")}</b></span><span>路段 <b>${esc(i.segment||"—")}</b></span><span>有觀測年 <b>${oy}</b></span><span>${t('consStatus')} <b>${consStr(i)}</b></span>`;
  return card(`${i.uid} · ${esc(indName(i))}`,"",
    `${badges(i)}<div class="statbar">${sb}</div>${blocks}${i.note?`<div class="note"><b>${t('note')}</b>：${esc(i.note.replace(/\n/g,"  "))}</div>`:""}`);
}

      ${rowV2("leaf",M.phases2.leaf,V2C.leaf)}${rowV2("flower",M.phases2.flower,V2C.flower)}${rowV2("fruit",M.phases2.fruit,V2C.fruit)}</table>

${EN()?`· A blank phenophase in a month that WAS surveyed means recorded as absent, not missing. Percentages therefore use every monitored individual that month as the denominator.
· Full-width characters are read as their half-width equivalents everywhere (Ｘ→X, ？→?, full-width digits).
· X in a phenophase cell means the individual was gone that month (${M.n_gone_cells||0} month-cells). Those months are excluded from every denominator and shown as ✕.`
:`· 該月有踏查時，物候格空白代表「調查過但沒有」，不是漏記。百分比的分母因此是當月受監測的每一株。
· 全形一律當半形處理（Ｘ→X、？→?、全形數字）。
· 物候格的 X 代表該月該株已不在（目前 ${M.n_gone_cells||0} 個月格）；這些月份不計入任何分母，並以 ✕ 顯示。`}</div>

:`· 月解析度；起始以實際踏查日定位，不確定區間＝相鄰兩次踏查的間距，而非固定 ±15 天。
· 仍有 ${M.unreadable||0} 個非空儲存格無法判讀為代號，幾乎都是帶問號的存疑寫法；這些未納入資料。約定作法是填最接近的代號，把疑慮寫進備註。
· 跨年個體比對以內容為準；${M.corrections}
· 已枯死 ${M.n_dead||0} 株與主檔已除名個體，預設由頁首「狀態」排除。`}</div>

${EN()?"Cite as":"引用格式"}：二格山稜線植物物候資料集 (${LAST}). v${(M.asof||"").slice(0,7)}. ${location.href.split("#")[0]}
${EN()?"Generated":"本頁重建於"}：${M.generated||"—"}　·　${EN()?"Data as of":"資料截止"}：${M.asof||"—"}</div>`);
}

// ---- 分類樹狀圖 ----
// 縮排式樹狀圖：深度由位置決定，不另外用色相編碼（科／屬／種／個體四層
// 中文名稱分欄橫排會嚴重溢出，縮排才容得下長名稱）。
const TREE_OPEN=new Set();
const TREE_MAX_ROWS=600;
const TREE_AUTO_ROWS=60;   // 全開後不超過這麼多列就直接攤開
let TREE_ROWS=[],TREE_SCOPE=null;

function treeNest(inds){
  const fams=new Map();
  inds.forEach(i=>{
    const f=i.fam||"—",g=i.gen||"—",sp=i.species||"—";
    if(!fams.has(f))fams.set(f,new Map());
    const gm=fams.get(f);
    if(!gm.has(g))gm.set(g,new Map());
    const sm=gm.get(g);
    if(!sm.has(sp))sm.set(sp,[]);
    sm.get(sp).push(i);
  });
  return fams;
}
function treeSort(entries,countFn){
  return entries.sort((a,b)=>{const A=countFn(a[1]),B=countFn(b[1]);
    return B.sp-A.sp||B.n-A.n||a[0].localeCompare(b[0],"zh-Hant");});
}
function genStats(gm){let n=0;const sp=new Set();
  gm.forEach((sm,g)=>sm.forEach((list,s)=>{n+=list.length;sp.add(s);}));return {n,sp:sp.size};}
function spStats(sm){let n=0;sm.forEach(list=>n+=list.length);return {n,sp:sm.size};}

function treeRows(inds){
  const rows=[];
  const fams=treeNest(inds);
  treeSort([...fams.entries()],gm=>{const x=genStats(gm);return {sp:x.sp,n:x.n};}).forEach(([f,gm])=>{
    const fs=genStats(gm),fk="f\u0000"+f;
    const fOpen=TREE_OPEN.has(fk);
    rows.push({d:0,k:fk,label:EN()?(FAMS[f]||f):f,sp:fs.sp,n:fs.n,kids:true,open:fOpen});
    if(!fOpen)return;
    treeSort([...gm.entries()],sm=>spStats(sm)).forEach(([g,sm])=>{
      const gs=spStats(sm),gk=fk+"\u0000"+g;
      const gOpen=TREE_OPEN.has(gk);
      rows.push({d:1,k:gk,label:EN()?(GENS[g]||g):g,sp:gs.sp,n:gs.n,kids:true,open:gOpen});
      if(!gOpen)return;
      [...sm.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"zh-Hant"))
        .forEach(([sp,list])=>{
          const sk=gk+"\u0000"+sp,sOpen=TREE_OPEN.has(sk);
          rows.push({d:2,k:sk,label:EN()?(SPS[sp]||sp):sp,n:list.length,kids:true,open:sOpen,sci:EN()});
          if(!sOpen)return;
          list.slice().sort((a,b)=>a.seq-b.seq).forEach(i=>{
            rows.push({d:3,k:sk+"\u0000"+i.uid,label:`${i.uid} · ${indName(i)}`,
                       kids:false,ind:i});
          });
        });
    });
  });
  return rows;
}

// 換了篩選範圍就重新決定展開程度：小樹直接全開（篩完就該看得到裡面），
// 大樹維持收合。同一個範圍內則尊重使用者自己點出來的狀態。
function treeAutoOpen(inds){
  const sig=[S.fam,S.gen,S.sp,S.cons,S.endemic,S.onlyObs,inds.length].join("\u0000");
  if(sig===TREE_SCOPE)return;
  TREE_SCOPE=sig;
  TREE_OPEN.clear();
  const keys=treeRowsAllKeys(inds);
  if(keys.length+inds.length<=TREE_AUTO_ROWS)keys.forEach(k=>TREE_OPEN.add(k));
}

function viewTree(){
  const inds=inScope();
  treeAutoOpen(inds);
  const head=`<div class="card panel"><div class="chead"><div><h2>${t('tabTree')}</h2>
    <div class="desc">${t('treeDesc')}</div></div><div class="sp"></div>${subjectBar()}</div>
    <div class="seg" style="max-width:260px;margin-bottom:12px">
      <button onclick="window._treeAll(1)">${t('treeExpand')}</button>
      <button onclick="window._treeAll(0)">${t('treeCollapse')}</button>
    </div>`;
  if(!inds.length)return head+`<div class="empty">${t('treeEmpty')}</div></div>`;

  let rows=treeRows(inds);
  const over=rows.length>TREE_MAX_ROWS;
  if(over)rows=rows.slice(0,TREE_MAX_ROWS);
  TREE_ROWS=rows;

  const rowH=24,indent=22,padL=16,padT=16,labelX=13;
  const H=padT+rows.length*rowH+10, W=760;
  let g=svg(W,H);

  // 連接線：由父節點的垂直線拉到各子節點，細髮絲實線。
  const yOf=r=>padT+r*rowH+rowH/2;
  rows.forEach((r,ri)=>{
    if(r.d===0)return;
    // 找父列
    let pi=ri-1; while(pi>=0&&rows[pi].d>=r.d)pi--;
    if(pi<0)return;
    const px=padL+rows[pi].d*indent, x=padL+r.d*indent;
    // 最後一個同層手足決定垂直線要畫到哪
    let last=ri; for(let j=ri+1;j<rows.length;j++){if(rows[j].d<r.d)break;if(rows[j].d===r.d)last=j;}
    if(ri===pi+1)g+=ln(px,yOf(pi)+6,px,yOf(last),css('--line'));
    g+=ln(px,yOf(ri),x-4,yOf(ri),css('--line'));
  });

  rows.forEach((r,ri)=>{
    const x=padL+r.d*indent,y=yOf(ri);
    let row="";
    if(r.kids){
      // 可展開的節點：實心圓點＋三角指示
      row+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${css('--accent')}"/>`;
      row+=txt(x-14,y+4,r.open?"\u25be":"\u25b8",{fill:css('--muted'),fs:11});
    }else{
      row+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="${css('--accent2')}" stroke-width="1.5"/>`;
    }
    const bold=r.d===0?600:(r.d===1?500:400);
    const italic=r.d===2&&r.sci?' font-style="italic"':'';
    // 個體列的文字顏色由 g.treeind 的樣式接手，當成連結呈現。
    const fill=r.kids?` fill="${css('--ink')}"`:'';
    row+=`<text class="lbl" x="${x+labelX}" y="${y+4}"${fill} font-size="${r.d===0?13:12}" font-weight="${bold}"${italic}>${r.label}</text>`;
    const meta=r.kids
      ? (r.sp!==undefined?(EN()?`${r.sp} spp · ${r.n} ind`:`${r.sp} 種 · ${r.n} 株`)
                         :(EN()?`${r.n} ind`:`${r.n} 株`))
      : (r.ind&&r.ind.retired?t('retired'):"");
    if(meta)row+=txt(W-14,y+4,meta,{a:"end",fill:css('--muted'),fs:11});
    // 整列可點：分類節點展開／收合，個體列跳到個體物候月曆。
    // 傳的是列索引而非節點鍵：名稱裡若有引號或分隔字元，內嵌成字串會把 onclick 弄壞。
    const call=r.kids?`window._treeToggle(${ri})`:`window._treeGoInd(${ri})`;
    const tip=r.kids?r.label:`${t('treeOpenInd')} — ${r.label}`;
    row+=`<rect class="hit" x="0" y="${y-rowH/2}" width="${W}" height="${rowH}" fill="transparent" onclick="${call}"><title>${tip}</title></rect>`;
    g+=`<g class="treerow ${r.kids?'treebranch':'treeind'}">${row}</g>`;
  });
  g+="</svg>";

  const note=over?`<div class="note">${t('treeTrunc').replace('{n}',TREE_MAX_ROWS)}</div>`:"";
  return head+`<div class="scroll">${g}</div>${note}</div>`;
}
window._treeToggle=ri=>{const r=TREE_ROWS[ri];if(!r)return;
  if(TREE_OPEN.has(r.k))TREE_OPEN.delete(r.k);else TREE_OPEN.add(r.k);render();};
window._treeGoInd=ri=>{const r=TREE_ROWS[ri];if(!r||!r.ind)return;
  S.ind=r.ind.uid;S.tab="individual";render();
  document.getElementById("view").scrollIntoView({block:"start",behavior:"smooth"});};
window._treeAll=on=>{
  TREE_OPEN.clear();
  if(on)treeRowsAllKeys(inScope()).forEach(k=>TREE_OPEN.add(k));
  render();};
// 全開／全收與單一節點切換都是使用者的決定，之後同一範圍內不再自動調整。
function treeRowsAllKeys(inds){
  const keys=[],fams=treeNest(inds);
  fams.forEach((gm,f)=>{const fk="f\u0000"+f;keys.push(fk);
    gm.forEach((sm,g)=>{const gk=fk+"\u0000"+g;keys.push(gk);
      sm.forEach((list,sp)=>keys.push(gk+"\u0000"+sp));});});
  return keys;
}

// ---- render dispatch ----

// ===================== render / events =====================
const VIEWFN={now:viewNow,coverage:viewCoverage,individual:viewIndividual,community:viewCommunity,
              onset:viewOnset,taxon:viewTaxon,sequence:viewSequence,overlap:viewOverlap,
              tree:viewTree,methods:viewMethods};
function footHTML(){
  return `${EN()?"Survey":"物候踏查"}：${EN()?"SOW Taipei Branch · Mt. Erge group interpretive volunteers":"荒野保護協會台北分會 · 二格山組解說志工"} ｜ ${EN()?"Taxonomy":"分類資料"}：TaiCoL · iNaturalist ｜ ${EN()?"Codes":"代號對照"}：USA-NPN / PPO<br>
   <span class="pill">CC BY 4.0</span><span class="pill">${EN()?"Data as of":"資料截止"} ${M.asof||"—"}</span><span class="pill">${EN()?"Built":"重建"} ${M.generated||"—"}</span>
   <span class="pill">${M.n_individuals} ${EN()?"individuals":"株"} · ${YEARS[0]}–${LAST}</span>`;
}
function render(){
  if(!VIEWS[S.tab])S.tab="now";
  if(!SUBJ_OF("ind"))S.ind=S.ind;             // keep selection across views
  writeURL();
  document.documentElement.lang=EN()?"en":"zh-Hant";
  renderHeader();renderNav();renderChips();
  document.getElementById("view").innerHTML=(VIEWFN[S.tab]||viewNow)();
  document.getElementById("foot").innerHTML=footHTML();
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
  wireCard();
}
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;render();});
document.getElementById("btnCsv").onclick=exportCSV;
document.getElementById("btnShare").onclick=()=>{
  const u=location.href;
  const done=()=>{const h=document.getElementById("shareHint");if(h){h.textContent=t('copied');h.style.color=css('--accent');setTimeout(()=>{h.textContent=t('shareHint');h.style.color="";},2200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done).catch(done);
  else{const ta=document.createElement("textarea");ta.value=u;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}
};
document.addEventListener("click",e=>{
  const p=document.getElementById("pop");
  if(p&&p.style.display!=="none"&&!e.target.closest(".gearwrap"))p.style.display="none";
});
window.addEventListener("hashchange",()=>{S=Object.assign({},DEF);readURL();render();});
readURL();render();
})();
